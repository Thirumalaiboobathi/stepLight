version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Dependabot's pnpm calls otherwise apply a 3-day release-age gate that fails the whole job
    # whenever any transitive dependency (e.g. rollup's platform packages) shipped in that window.
    cooldown:
      default-days: 0
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
