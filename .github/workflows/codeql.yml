name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3" # weekly, Wednesday 03:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read # the action reads its own workflow run (needed on private repositories)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
          # Code scanning results can only be uploaded on public repositories (or with GitHub
          # Advanced Security). On a private repository the analysis still runs, but the SARIF
          # file is kept as a build artifact instead of failing the job at the upload.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14
