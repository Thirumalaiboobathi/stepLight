<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Steplight</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Steplight <span id="mode" class="mode standalone">Standalone</span></h1>
    <label for="task">Task name</label>
    <input id="task" placeholder="e.g. Book the cheapest flight" />
    <button id="toggle" class="start">Start recording</button>
    <div id="state">Not recording</div>
    <div id="error"></div>
    <a id="viewer" href="#">Open viewer ↗</a>
    <details class="pair">
      <summary>Pair with CLI (optional)</summary>
      <label for="pairLink">Paste the link printed by <code>steplight view</code></label>
      <input id="pairLink" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:4777/#token=…" />
      <button id="pair" type="button">Pair</button>
      <div id="pairState"></div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
