packages:
  - "packages/*"
  - "examples/*"
onlyBuiltDependencies:
  - esbuild

# Dependabot hands its cooldown to pnpm as a release-age gate (patch cooldown 4 days =
# minimum-release-age=5760) and then re-resolves the WHOLE tree with it, so one too-young transitive
# or already-locked package (playwright, vite, rollup, OpenTelemetry...) fails the entire npm job.
# The gate is therefore not applied by pnpm. Dependabot's own cooldown (dependabot.yml) still decides
# which versions it is allowed to propose, and `pnpm install` here never uses a release-age gate.
minimumReleaseAgeExclude:
  - "*"
