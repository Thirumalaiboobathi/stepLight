name: Release

# Publishes the npm packages with provenance when a version tag is pushed (for example v0.2.0).
# Needs the repository secret NPM_TOKEN (an automation token limited to the @steplight scope).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release # protect with required reviewers in the repository settings
    permissions:
      contents: read
      id-token: write # lets npm attach a signed provenance statement to each package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm --filter @steplight/core --filter @steplight/sdk --filter @steplight/redteam --filter @steplight/cli publish --access public --no-git-checks
