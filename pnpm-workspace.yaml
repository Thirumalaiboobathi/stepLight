packages:
  - "packages/*"
  - "examples/*"
onlyBuiltDependencies:
  - esbuild

# This exclusion exists only so that the release-age gate Dependabot injects into its pnpm calls
# (derived from its cooldown) does not fail the whole job on transitive releases that are a few days
# old. The real gate is the cooldown in .github/dependabot.yml; plain `pnpm install` has no gate.
minimumReleaseAgeExclude:
  - "*"
