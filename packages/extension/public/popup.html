<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Steplight</title>
    <style>
      :root { color-scheme: light dark; }
      body { width: 300px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; }
      h1 { font-size: 16px; margin: 0 0 10px; }
      label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 8px; font: inherit; }
      button { width: 100%; margin-top: 10px; padding: 8px; font: inherit; border: 0; border-radius: 6px; color: #fff; cursor: pointer; }
      button.start { background: #4f46e5; }
      button.stop { background: #dc2626; }
      #state { margin-top: 10px; font-size: 12px; }
      #error { margin-top: 6px; font-size: 12px; color: #dc2626; }
      .mode { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; vertical-align: middle; }
      .mode.connected { background: #d1fae5; color: #065f46; }
      .mode.standalone { background: #e0e7ff; color: #3730a3; }
      a { display: inline-block; margin-top: 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Steplight <span id="mode" class="mode standalone">Standalone</span></h1>
    <label for="task">Task name</label>
    <input id="task" placeholder="e.g. Book the cheapest flight" />
    <button id="toggle" class="start">Start recording</button>
    <div id="state">Not recording</div>
    <div id="error"></div>
    <a id="viewer" href="#">Open viewer ↗</a>
    <script src="popup.js"></script>
  </body>
</html>
